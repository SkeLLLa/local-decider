# yaml-language-server: $schema=../schemas/policy.schema.json
# Turn outcome: when an agent turn ends, did it finish, get stuck, need the user, or fail?
id: turn-outcome
version: 2
description: Classify how an agent turn ended so stuck or blocked agents can be surfaced.
mode: shadow
priority: low
state:
  maxTokens: 3000
  sections:
    - { label: Task, from: task, keep: head }
    - { label: Turn transcript, from: history, keep: tail }
    - { label: Final message, from: lastMessage, keep: tail }
questions:
  outcome:
    type: choice
    instructions: >-
      An autonomous coding agent just ended its turn. Classify the end state from the transcript and
      its final message.
    criteria:
      done: work complete and nothing left for the user to decide or approve
      needs_input: the agent asks a question, waits for approval, or leaves a decision or choice for the user before the work counts as finished
      stuck: The agent is looping, gave up, or stopped partway without a clear reason or next step.
      failed: The agent reports an error, a failing build or test, or that it could not do the task.
rules:
  - when: { question: outcome, answer: done, minConfidence: 0.6 }
    action: log
  - when: { question: outcome, answer: needs_input, minConfidence: 0.6 }
    action: notify
  - when: { question: outcome, answer: stuck, minConfidence: 0.6 }
    action: notify
  - when: { question: outcome, answer: failed, minConfidence: 0.6 }
    action: notify
default: log
