name: Release

# release-please keeps one release PR per package (conventional commits decide the bump). Merging
# it tags the release; CI tests the master push while this job builds and publishes the npm packages
# with provenance through npm trusted publishing (OIDC), so no NPM_TOKEN secret exists.
on:
  push:
    branches: [master]

permissions: {}

# Releases queue instead of cancelling: a cancelled run can leave a tag without its publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      # Every release-please output (paths_released, <path>--tag_name, ...) for release-assets.
      rp: ${{ toJSON(steps.rp.outputs) }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install node and pnpm (versions from mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build publishable packages
        run: pnpm -r build
      # Release runs alongside CI on the master push, not after it, so it re-checks the bundle.
      - name: Plugin package contents
        run: scripts/check-plugin-pack.sh
      # Publishes only package versions not yet on the registry; private packages are skipped.
      - name: Publish
        run: pnpm -r publish --access public --provenance --no-git-checks

  # Signs the tarballs npm now serves (the exact bytes users install) with a Sigstore build
  # provenance attestation and attaches tarball + bundle to each GitHub release, so
  # `gh attestation verify <tgz> -R ziptie-soft/local-decider` works and Scorecard's
  # Signed-Releases check finds a signature next to every release.
  release-assets:
    name: Sign release assets
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the published tarballs
        env:
          RP_OUTPUTS: ${{ needs.release-please.outputs.rp }}
        run: |
          set -euo pipefail
          mkdir -p assets
          : > assets.list
          jq -r '.paths_released | fromjson | .[]' <<<"$RP_OUTPUTS" | while read -r path; do
            tag=$(jq -r --arg k "$path--tag_name" '.[$k]' <<<"$RP_OUTPUTS")
            name=$(jq -r .name "$path/package.json")
            version=$(jq -r .version "$path/package.json")
            file=""
            # The registry can lag a few seconds behind a fresh publish.
            for _ in 1 2 3 4 5 6; do
              if file=$(npm pack "$name@$version" --pack-destination assets --json | jq -r '.[0].filename'); then
                break
              fi
              sleep 10
            done
            test -s "assets/$file"
            printf '%s %s\n' "$tag" "assets/$file" >> assets.list
          done
          cat assets.list
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.tgz
      - name: Attach tarballs and signatures to the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          while read -r tag file; do
            cp "$BUNDLE" "$file.sigstore.json"
            gh release upload "$tag" "$file" "$file.sigstore.json" --clobber
          done < assets.list
