name: CI

# Pull requests and pushes to master. Every action is pinned to a commit SHA (Dependabot bumps
# the SHA and its version comment); `mise run lint:pins` checks that locally and here.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Online mode (impostor commits, known-vulnerable actions, ref confusion); `mise run lint:zizmor`
  # runs the offline audits locally.
  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  # Every OS-independent check in `mise run check`, run once and in parallel (`:::`): TS lint and
  # typecheck, action pins, workflow/Markdown/shell lint, hook shim tests, complexity and fallow.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install node, pnpm and linters (versions from mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm bats jactionlint shellcheck rumdl github:moznion/cccc github:fallow-rs/fallow
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Checks
        run: >-
          mise run --jobs 4
          lint ::: typecheck ::: lint:pins ::: lint:actions ::: lint:shell ::: test:shim :::
          md-check ::: lint:complexity ::: lint:fallow

  build:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # node24 layers mise.node24.toml/.lock over mise.toml; '' keeps the default pins.
      MISE_ENV: ${{ matrix.mise_env }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `node` is the label only: mise.toml pins the current Node and mise.node24.toml the previous
        # major (engines.node >=24); both are in mise lockfiles, which `mise install --locked` needs.
        # Linux covers both Node majors; macOS covers the current Node and Apple Silicon/MLX.
        include:
          - os: ubuntu-latest
            node: '26'
            mise_env: ''
          - os: ubuntu-latest
            node: '24'
            mise_env: node24
          - os: macos-latest
            node: '26'
            mise_env: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install node and pnpm (versions from mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      # The plugin bundle is built, not committed; a broken `files` list must fail before release.
      - name: Plugin package contents
        run: scripts/check-plugin-pack.sh
      - name: Test
        run: pnpm -r test
