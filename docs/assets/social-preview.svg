<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="local-decider: local decision models for coding agents">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10201b"/>
      <stop offset="1" stop-color="#080e0c"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2fbf7f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2fbf7f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7cf2c0" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <linearGradient id="sp-hot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf7f"/>
      <stop offset="1" stop-color="#7cf2c0"/>
    </linearGradient>
    <linearGradient id="sp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14241f"/>
      <stop offset="1" stop-color="#0b1411"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#sp-bg)"/>
  <rect width="1280" height="640" fill="url(#sp-grid)"/>
  <rect width="1280" height="640" fill="url(#sp-glow)"/>

  <!-- logo -->
  <g transform="translate(96 200) scale(1.875)">
    <rect width="128" height="128" rx="28" fill="url(#sp-tile)"/>
    <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#2fbf7f" stroke-opacity=".35" stroke-width="3"/>
    <path d="M64 66 C64 48 38 46 38 30" fill="none" stroke="#3b5049" stroke-width="9" stroke-linecap="round"/>
    <circle cx="38" cy="28" r="7" fill="#0f1a16" stroke="#3b5049" stroke-width="5"/>
    <path d="M64 104 L64 66 C64 48 90 46 90 30" fill="none" stroke="url(#sp-hot)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="90" cy="27" r="10" fill="#7cf2c0"/>
    <circle cx="64" cy="70" r="11" fill="#0b1411" stroke="#7cf2c0" stroke-width="5"/>
    <circle cx="64" cy="70" r="3.5" fill="#7cf2c0"/>
  </g>

  <g font-family="Inter, 'Noto Sans', 'Segoe UI', sans-serif">
    <text x="420" y="250" fill="#eafff5" font-size="76" font-weight="700" letter-spacing="-1.5">local-decider</text>
    <text x="422" y="302" fill="#9fb8ae" font-size="29">Small local models answer routine agent questions</text>
    <text x="422" y="340" fill="#9fb8ae" font-size="29">in one forward pass. The rest goes to the big LLM.</text>
  </g>

  <!-- sample decisions -->
  <g font-family="'JetBrainsMono Nerd Font', 'JetBrains Mono', 'Fira Code', monospace" font-size="21">
    <rect x="420" y="378" width="760" height="150" rx="14" fill="#0b1411" stroke="#2fbf7f" stroke-opacity=".25"/>
    <text x="446" y="418" fill="#5f7a70">turn-outcome</text><text x="660" y="418" fill="#7cf2c0">done</text><text x="840" y="418" fill="#eafff5">0.94</text><text x="940" y="418" fill="#5f7a70">act     → notify</text>
    <text x="446" y="458" fill="#5f7a70">permission</text><text x="660" y="458" fill="#7cf2c0">allow</text><text x="840" y="458" fill="#eafff5">0.98</text><text x="940" y="458" fill="#5f7a70">act     → allow</text>
    <text x="446" y="498" fill="#5f7a70">command-risk</text><text x="660" y="498" fill="#f2c46d">risky</text><text x="840" y="498" fill="#eafff5">0.61</text><text x="940" y="498" fill="#5f7a70">abstain → ask you</text>
  </g>

  <g font-family="Inter, 'Noto Sans', 'Segoe UI', sans-serif" font-size="20" fill="#cfe9de">
    <rect x="420" y="556" width="96" height="38" rx="19" fill="#2fbf7f" fill-opacity=".14" stroke="#2fbf7f" stroke-opacity=".45"/>
    <text x="468" y="582" text-anchor="middle">Paseo</text>
    <rect x="528" y="556" width="148" height="38" rx="19" fill="#2fbf7f" fill-opacity=".14" stroke="#2fbf7f" stroke-opacity=".45"/>
    <text x="602" y="582" text-anchor="middle">Claude Code</text>
    <rect x="688" y="556" width="96" height="38" rx="19" fill="#2fbf7f" fill-opacity=".14" stroke="#2fbf7f" stroke-opacity=".45"/>
    <text x="736" y="582" text-anchor="middle">Codex</text>
    <text x="1180" y="582" text-anchor="end" fill="#5f7a70">127.0.0.1 · CPU / GPU / NPU</text>
  </g>
</svg>
