<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="local-decider">
  <defs>
    <linearGradient id="ld-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14241f"/>
      <stop offset="1" stop-color="#0b1411"/>
    </linearGradient>
    <linearGradient id="ld-hot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf7f"/>
      <stop offset="1" stop-color="#7cf2c0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#ld-bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#2fbf7f" stroke-opacity=".28" stroke-width="3"/>
  <!-- rejected branch -->
  <path d="M64 66 C64 48 38 46 38 30" fill="none" stroke="#3b5049" stroke-width="9" stroke-linecap="round"/>
  <circle cx="38" cy="28" r="7" fill="#0f1a16" stroke="#3b5049" stroke-width="5"/>
  <!-- stem and chosen branch -->
  <path d="M64 104 L64 66 C64 48 90 46 90 30" fill="none" stroke="url(#ld-hot)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="90" cy="27" r="10" fill="#7cf2c0"/>
  <!-- decision node -->
  <circle cx="64" cy="70" r="11" fill="#0b1411" stroke="#7cf2c0" stroke-width="5"/>
  <circle cx="64" cy="70" r="3.5" fill="#7cf2c0"/>
</svg>
