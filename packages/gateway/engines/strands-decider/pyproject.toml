# Managed environment for the strands-decider engine. `local-decider engine install` runs
#   uv sync --project <this dir> --extra <cpu|mlx|cuda>
# with UV_PROJECT_ENVIRONMENT=~/.local/share/local-decider/venvs/strands-decider, so the venv
# never lives inside a plugin or package directory.
[project]
name = "local-decider-strands-engine"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  # Pinned to a main commit: Gemma 4 and MLX support are not in a PyPI release yet.
  "strands-decider @ git+https://github.com/strands-labs/strands-decider@846b69ebe7603038caa3bfe250e50f1137b141d7",
]

[project.optional-dependencies]
cpu = ["torch>=2.7"]
mlx = [
  "strands-decider[mlx] @ git+https://github.com/strands-labs/strands-decider@846b69ebe7603038caa3bfe250e50f1137b141d7",
]
cuda = ["torch>=2.7"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "mlx" }]]

# CPU-only torch wheels on Linux (the default PyPI wheel pulls ~3 GB of CUDA libraries).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
