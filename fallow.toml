# fallow: dead code, duplication and complexity (`mise run lint:fallow`).
# See https://fallow.tools/docs/

# register.mjs is generated from packages/hooks/src/mod; tests/ runs under `claude plugin test`
# (mise run test:mod), which supplies the `claude-code/testing` module.
ignorePatterns = ["plugins/local-decider/hooks/register.mjs", "plugins/local-decider/tests/**"]

[health]
maxCyclomatic = 15
maxCognitive = 15
# Tests write lcov (node --test), not the Istanbul JSON fallow reads; gate on complexity only.
maxCrap = 10000.0
