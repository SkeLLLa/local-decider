[global]
exclude = ["node_modules", "**/node_modules", ".claude", ".serena", "**/CHANGELOG.md", "dist"]

# Prose is hand-wrapped at 100 columns; tables and code blocks carry long literal lines.
[MD013]
line-length = 100
tables = false
code-blocks = false

# Research notes quote schemas, URLs and CLI output verbatim.
[per-file-ignores]
"docs/research/*.md" = ["MD013"]
"docs/review/*.md" = ["MD013"]
